<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaalam Directory - Trusted Business Ecosystem</title>
    <meta name="description"
        content="Thaalam Directory - The trusted business ecosystem and community platform for entrepreneurs, professionals and businesses.">

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Splash Screen Styles -->
    <link rel="stylesheet" href="css/splash.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #080d0a;
            color: #ffffff;
            overflow: hidden;
        }

        .standalone-splash {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #080d0a;
            background-image:
                radial-gradient(ellipse at 50% 48%, rgba(6, 12, 9, 0.12) 0%, rgba(5, 10, 8, 0.32) 65%, rgba(4, 7, 6, 0.58) 100%),
                url('images/splash_bg.png');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            user-select: none;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .standalone-splash::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.45) 100%);
            pointer-events: none;
        }

        .splash-card {
            position: relative;
            z-index: 2;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .splash-brand-title {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: clamp(38px, 6.5vw, 72px);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            text-transform: lowercase;
            margin: 0;
            line-height: 1;
            filter: drop-shadow(0 4px 28px rgba(0, 0, 0, 0.85));
            animation: splashFadeInUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        .splash-timer-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
        }

        .splash-timer-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.4), #ffffff, rgba(255, 255, 255, 0.4));
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            transition: width 2.8s cubic-bezier(0.2, 0, 0.1, 1);
        }

        @keyframes splashFadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .splash-brand-title {
                font-size: clamp(34px, 10vw, 48px);
            }
        }
    </style>
</head>

<body>
    <main class="standalone-splash" id="standaloneSplash" onclick="enterSite()">
        <div class="splash-card">
            <h1 class="splash-brand-title">thaalam</h1>
        </div>

        <div class="splash-timer-progress">
            <div class="splash-timer-bar" id="timerBar"></div>
        </div>
    </main>

    <script>
        let hasEntered = false;

        function enterSite() {
            if (hasEntered) return;
            hasEntered = true;

            const splash = document.getElementById('standaloneSplash');
            splash.style.opacity = '0';
            splash.style.transform = 'scale(1.025)';
            splash.style.filter = 'blur(4px)';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 650);
        }

        // Start progress bar animation
        requestAnimationFrame(() => {
            const bar = document.getElementById('timerBar');
            if (bar) bar.style.width = '100%';
        });

        // Auto redirect after 2.8s
        const autoTimer = setTimeout(() => {
            enterSite();
        }, 2800);

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (['Space', 'Enter', 'Escape', 'ArrowDown'].includes(e.code) || [' ', 'Enter', 'Escape'].includes(e.key)) {
                clearTimeout(autoTimer);
                enterSite();
            }
        });
    </script>
</body>

</html>
